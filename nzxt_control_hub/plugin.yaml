id: nzxt_control_hub
name: NZXT RGB & Fan Controller
author: HaloDaemon
version: 1.2.1
api: "1.0"
license: GPL-3.0-or-later
description: NZXT Control Hub with chained RGB fan accessories.
translations:
  it:
    plugin.name: Controller RGB e ventole NZXT
    plugin.description: Hub di controllo NZXT con accessori per ventole RGB collegate.
capabilities: [lighting, lighting_division, cooling]
devices:
  - vendor: NZXT
    model: Control Hub
    type: hub
    match:
      hid: { vid: 0x1E71, pid: 0x2022 }
  - { vendor: NZXT, model: Smart Device V2, type: hub, match: { hid: { vid: 0x1E71, pid: 0x2006 } } }
  - { vendor: NZXT, model: Smart Device V2, type: hub, match: { hid: { vid: 0x1E71, pid: 0x200D } } }
  - { vendor: NZXT, model: Smart Device V2, type: hub, match: { hid: { vid: 0x1E71, pid: 0x200F } } }
  - { vendor: NZXT, model: "RGB & Fan Controller", type: hub, match: { hid: { vid: 0x1E71, pid: 0x2009 } } }
  - { vendor: NZXT, model: "RGB & Fan Controller", type: hub, match: { hid: { vid: 0x1E71, pid: 0x200E } } }
  - { vendor: NZXT, model: "RGB & Fan Controller", type: hub, match: { hid: { vid: 0x1E71, pid: 0x2010 } } }
  - { vendor: NZXT, model: "RGB & Fan Controller", type: hub, match: { hid: { vid: 0x1E71, pid: 0x2011 } } }
  - { vendor: NZXT, model: "RGB & Fan Controller", type: hub, match: { hid: { vid: 0x1E71, pid: 0x2019 } } }
  - { vendor: NZXT, model: "RGB & Fan Controller", type: hub, match: { hid: { vid: 0x1E71, pid: 0x2020 } } }
transports:
  hid: { report_size: 64, timeout_ms: 1000, feature_report: false }
