name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bootstrap:
        description: First publish, with no previous catalog
        type: boolean
        default: false

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test-plugins.yml
    with:
      catalog-url: https://timp4w.github.io/HaloDaemon-plugins/catalog.yaml
      trusted-key: halodaemon-official-2026=tjbwm5X4f70e+soVNV1AfRyb/TtnEsNNl+93YMO6IhQ=

  publish:
    needs: test
    uses: ./.github/workflows/publish-catalog.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      name: Halo Official Plugins
      catalog-url: https://timp4w.github.io/HaloDaemon-plugins/catalog.yaml
      key-id: halodaemon-official-2026
      trusted-key: halodaemon-official-2026=tjbwm5X4f70e+soVNV1AfRyb/TtnEsNNl+93YMO6IhQ=
      bootstrap: ${{ inputs.bootstrap == true }}
    secrets: inherit
