name: Test plugins

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Build without a previous catalog (first publish only)
        type: boolean
        default: false
  workflow_call:
    inputs:
      catalog-url:
        type: string
        required: true
      trusted-key:
        type: string
        required: true
      bootstrap:
        type: boolean
        default: false

jobs:
  plugin-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4
        with:
          path: plugins

      - name: Check out HaloDaemon
        uses: actions/checkout@v4
        with:
          repository: TimP4w/HaloDaemon
          ref: main
          path: halodaemon

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libpipewire-0.3-dev libudev-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: halodaemon/src

      - name: Build halod plugin-test harness
        run: cargo build -p halod --features plugin-test
        working-directory: halodaemon/src

      - name: Check protocol docs and the license notice
        run: |
          for manifest in plugins/*/plugin.yaml; do
            package="${manifest%/plugin.yaml}"
            test -f "$package/docs/protocol.md" || {
              echo "missing protocol documentation: $package/docs/protocol.md"
              exit 1
            }
          done
          python3 plugins/scripts/generate-licenses.py --check

      - name: Build a catalog against the published one
        env:
          CATALOG_URL: ${{ inputs.catalog-url || 'https://timp4w.github.io/HaloDaemon-plugins/catalog.yaml' }}
          TRUSTED_KEY: ${{ inputs.trusted-key || 'halodaemon-official-2026=tjbwm5X4f70e+soVNV1AfRyb/TtnEsNNl+93YMO6IhQ=' }}
          BOOTSTRAP: ${{ inputs.bootstrap == true }}
        run: |
          set -euo pipefail
          args=(--previous "$CATALOG_URL" --trusted-key "$TRUSTED_KEY")
          if [ "$BOOTSTRAP" = "true" ]; then
            args=(--bootstrap)
          elif [ "$(curl --silent --head --output /dev/null --write-out '%{http_code}' "$CATALOG_URL")" = 404 ]; then
            echo "$CATALOG_URL is not published yet; building without a previous catalog"
            args=(--bootstrap)
          fi
          cargo run --manifest-path halodaemon/src/Cargo.toml -p halod-plugin-signing -- \
            catalog plugins --out "$RUNNER_TEMP/catalog" --name "dry run" "${args[@]}"

      - name: Run halod plugin-test on every package with a test.lua
        run: |
          set -euo pipefail
          status=0
          for dir in */; do
            dir="${dir%/}"
            [ -f "$dir/plugin.yaml" ] || continue
            [ -f "$dir/test.lua" ] || { echo "$dir: no test.lua — skipping"; continue; }
            echo "::group::$dir"
            ../halodaemon/src/target/debug/halod plugin-test "$dir" || status=1
            echo "::endgroup::"
          done
          exit $status
        working-directory: plugins

  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
